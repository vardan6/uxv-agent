[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uxv-agent"
version = "0.1.0"
description = "Ground control station and AI agent layer for uncrewed vehicles"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["backend", "backend.*", "rag", "rag.*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
