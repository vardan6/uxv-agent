# Qdrant sidecar for Remote Rover RAG (ADR 0028).
#
# The repo's first mandatory runtime container. Prebuilt image, pulled once
# from Docker Hub — we build nothing here. Vector data persists in a named
# volume on the host across `rag down`/`rag up`.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: remote-rover-qdrant
    restart: unless-stopped
    ports:
      # Host ports sit in the project's 9000 range (GCS app is 9002); the
      # container keeps Qdrant's native 6333/6334 internally.
      - "${REMOTE_ROVER_QDRANT_REST_PORT:-9004}:6333" # REST API + dashboard
      - "${REMOTE_ROVER_QDRANT_GRPC_PORT:-9005}:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant ships no shell/curl; use its own binary to probe readiness.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    name: remote-rover-qdrant-storage
