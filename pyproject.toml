[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-rover"
version = "0.1.0"
description = "Remote Rover GCS, AI agent, and simulator monorepo"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["backend", "rag"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
